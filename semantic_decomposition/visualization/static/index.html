<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Semantic Decomposition — Live Graph</title>
<script src="https://unpkg.com/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
<style>
  :root {
    --bg: #0f1116;
    --panel: #171a21;
    --border: #2a2f3a;
    --text: #e6e9ef;
    --muted: #8b93a3;
    --accent: #4f8cff;
    --sidebar-w: 340px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  #app { display: flex; flex-direction: column; height: 100%; }

  header {
    display: flex; align-items: center; gap: 14px;
    padding: 10px 16px; background: var(--panel);
    border-bottom: 1px solid var(--border); flex-wrap: wrap;
  }
  header h1 { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: .2px; }
  header h1 span { color: var(--accent); }
  .controls { display: flex; align-items: center; gap: 8px; }
  input[type=text] {
    background: #0c0e13; border: 1px solid var(--border); color: var(--text);
    border-radius: 6px; padding: 7px 10px; font-size: 13px; width: 180px; outline: none;
  }
  input[type=text]:focus { border-color: var(--accent); }
  button {
    background: var(--accent); color: #fff; border: none; border-radius: 6px;
    padding: 7px 13px; font-size: 13px; cursor: pointer; font-weight: 500;
  }
  button.ghost { background: transparent; border: 1px solid var(--border); color: var(--muted); }
  button:hover { filter: brightness(1.08); }
  .status { color: var(--muted); font-size: 12.5px; margin-left: auto; min-height: 16px; }

  .legend { display: flex; gap: 14px; flex-wrap: wrap; padding: 8px 16px;
    background: var(--panel); border-bottom: 1px solid var(--border); font-size: 12px; }
  .legend .item { display: flex; align-items: center; gap: 6px; color: var(--muted); }
  .swatch { width: 22px; height: 3px; border-radius: 2px; display: inline-block; }
  .dot { width: 11px; height: 11px; border-radius: 50%; display: inline-block; border: 2px solid; }

  .main-area { display: flex; flex: 1; min-height: 0; position: relative; }
  #graph { flex: 1; min-height: 0; }

  /* ---- sidebar ---- */
  #sidebar {
    width: 0; overflow: hidden;
    background: var(--panel); border-left: 1px solid var(--border);
    transition: width 0.2s ease;
    display: flex; flex-direction: column;
  }
  #sidebar.open { width: var(--sidebar-w); }
  .sb-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 14px; border-bottom: 1px solid var(--border);
    min-height: 48px;
  }
  .sb-header h2 { margin: 0; font-size: 16px; font-weight: 600; }
  .sb-header .word-type { font-size: 11px; color: var(--muted); margin-left: 8px; font-weight: 400; }
  .sb-close {
    background: none; border: none; color: var(--muted); cursor: pointer;
    font-size: 18px; padding: 0 4px; line-height: 1;
  }
  .sb-close:hover { color: var(--text); }
  .sb-body {
    flex: 1; overflow-y: auto; padding: 0 0 16px 0;
  }
  .sb-body::-webkit-scrollbar { width: 5px; }
  .sb-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  .sb-section {
    padding: 10px 14px 0;
  }
  .sb-section h3 {
    font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px;
    color: var(--accent); margin: 0 0 8px; padding-bottom: 4px;
    border-bottom: 1px solid var(--border);
  }
  .sb-relation-label {
    font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase;
    letter-spacing: .4px; margin: 8px 0 3px;
  }
  .sb-def {
    font-size: 13px; color: var(--text); line-height: 1.5;
    padding: 4px 0; border-bottom: 1px solid rgba(42,47,58,.5);
  }
  .sb-def:last-child { border-bottom: none; }
  .sb-tags {
    display: flex; flex-wrap: wrap; gap: 5px; margin: 2px 0 6px;
  }
  .sb-tag {
    font-size: 11.5px; padding: 2px 8px; border-radius: 4px;
    background: rgba(79,140,255,.12); color: var(--accent);
    cursor: default; white-space: nowrap;
  }
  .sb-tag.syn { background: rgba(76,175,80,.12); color: #4caf50; }
  .sb-tag.ant { background: rgba(183,28,28,.12); color: #ef5350; }
  .sb-tag.hyper { background: rgba(239,83,80,.12); color: #ef5350; }
  .sb-tag.hypo { background: rgba(46,125,50,.12); color: #4caf50; }
  .sb-tag.mero { background: rgba(41,182,246,.12); color: #29b6f6; }
  .sb-edges { padding: 10px 14px; }
  .sb-edges h3 {
    font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px;
    color: var(--muted); margin: 0 0 6px; padding-bottom: 4px;
    border-bottom: 1px solid var(--border);
  }
  .sb-edge-item {
    font-size: 12.5px; color: var(--text); padding: 2px 0;
  }
  .sb-edge-rel { color: var(--muted); font-size: 11px; }
  .sb-loading { color: var(--muted); font-size: 13px; padding: 20px 14px; }
  .sb-empty { color: var(--muted); font-size: 13px; padding: 20px 14px; font-style: italic; }

  .hint { position: absolute; bottom: 14px; left: 16px; z-index: 5;
    color: var(--muted); font-size: 12px; background: rgba(23,26,33,.85);
    padding: 6px 10px; border: 1px solid var(--border); border-radius: 6px; }
  #err { display:none; padding: 30px; color: #ff8a80; font-size: 14px; text-align:center; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Semantic Decomposition <span>· live graph</span></h1>
    <div class="controls">
      <input id="word" type="text" placeholder="word to decompose…" />
      <button id="go">Decompose</button>
      <button id="fit" class="ghost">Fit</button>
      <button id="physics" class="ghost">Pause physics</button>
    </div>
    <div id="status" class="status"></div>
  </header>

  <div class="legend" id="legend"></div>

  <div class="main-area">
    <div id="graph"></div>
    <div id="sidebar">
      <div class="sb-header">
        <h2 id="sb-title">—</h2>
        <button class="sb-close" id="sb-close" title="Close">&times;</button>
      </div>
      <div class="sb-body" id="sb-body"></div>
    </div>
    <div class="hint">Double-click a node to decompose it further · click to inspect · scroll to zoom</div>
  </div>

  <div id="err"></div>
</div>

<script>
(function () {
  "use strict";

  if (typeof vis === "undefined") {
    document.getElementById("graph").style.display = "none";
    var e = document.getElementById("err");
    e.style.display = "block";
    e.textContent = "Could not load vis-network from the CDN. Check your internet connection and reload.";
    return;
  }

  // relation -> edge colour
  var REL_COLORS = {
    synonym:    "#4caf50",
    hyponym:    "#2e7d32",
    hypernym:   "#ef5350",
    antonym:    "#b71c1c",
    definition: "#ff9800",
    meronym:    "#29b6f6",
    derivation: "#ab47bc",
    other:      "#90a4ae"
  };

  // ---- build legend ----
  var legend = document.getElementById("legend");
  Object.keys(REL_COLORS).forEach(function (rel) {
    if (rel === "other") return;
    var item = document.createElement("div");
    item.className = "item";
    item.innerHTML = '<span class="swatch" style="background:' + REL_COLORS[rel] + '"></span>' + rel;
    legend.appendChild(item);
  });
  ["root", "expanded", "unexpanded"].forEach(function (kind) {
    var map = { root: ["#ffd54f", "#f9a825"], expanded: ["#e3f2fd", "#1e88e5"], unexpanded: ["#ffffff", "#b0bec5"] };
    var item = document.createElement("div");
    item.className = "item";
    item.innerHTML = '<span class="dot" style="background:' + map[kind][0] + ';border-color:' + map[kind][1] + '"></span>' + kind;
    legend.appendChild(item);
  });

  // ---- datasets + network ----
  var nodes = new vis.DataSet();
  var edges = new vis.DataSet();

  var container = document.getElementById("graph");
  var network = new vis.Network(container, { nodes: nodes, edges: edges }, {
    nodes: {
      shape: "dot", size: 16,
      font: { color: "#e6e9ef", size: 14, face: "-apple-system, Segoe UI, sans-serif" }
    },
    edges: {
      arrows: { to: { enabled: true, scaleFactor: 0.6 } },
      smooth: { type: "dynamic" },
      font: { color: "#8b93a3", size: 10, strokeWidth: 0, align: "middle" },
      width: 1.5
    },
    physics: {
      barnesHut: { gravitationalConstant: -6000, springLength: 130, springConstant: 0.03, damping: 0.4 },
      stabilization: { iterations: 120 }
    },
    interaction: { hover: true, tooltipDelay: 120, multiselect: false }
  });

  // ---- physics: auto-freeze once settled ----
  var userPausedPhysics = false;
  var lastClickedNode = null;
  function setPhysics(on) { network.setOptions({ physics: { enabled: on } }); }
  function relayout() { if (!userPausedPhysics) setPhysics(true); }
  network.on("stabilized", function () { if (!userPausedPhysics) setPhysics(false); });

  function nodeStyle(n) {
    if (n.root) {
      return { color: { background: "#ffd54f", border: "#f9a825" }, borderWidth: 3,
               shapeProperties: { borderDashes: false } };
    }
    if (n.expanded) {
      return { color: { background: "#e3f2fd", border: "#1e88e5" }, borderWidth: 2,
               shapeProperties: { borderDashes: false } };
    }
    return { color: { background: "#ffffff", border: "#b0bec5" }, borderWidth: 2,
             shapeProperties: { borderDashes: [6, 4] } };
  }

  // keep server-shaped node data for sidebar reconstruction
  var serverNodes = {};

  function toVisNode(n) {
    serverNodes[n.id] = n;
    var base = {
      id: n.id,
      label: n.label,
      title: n.word_type + (n.expanded ? "" : " · double-click to expand")
    };
    return Object.assign(base, nodeStyle(n));
  }

  function toVisEdge(e) {
    var c = REL_COLORS[e.relation] || REL_COLORS.other;
    return {
      id: e.id, from: e.source, to: e.target,
      label: e.relation,
      color: { color: c, highlight: c, hover: c },
      title: e.relation + " (weight " + e.weight + ")"
    };
  }

  // ---- status ----
  var statusEl = document.getElementById("status");
  function setStatus(msg) { statusEl.textContent = msg || ""; }

  // ---- apply incoming events ----
  function applyEvent(ev) {
    if (ev.type === "add_node") {
      nodes.update(toVisNode(ev.node));
      relayout();
    } else if (ev.type === "add_edge") {
      edges.update(toVisEdge(ev.edge));
    } else if (ev.type === "node_expanded") {
      var existing = nodes.get(ev.id);
      if (existing) {
        var sn = serverNodes[ev.id];
        if (sn) sn.expanded = true;
        existing.expanded = true;
        nodes.update(toVisNode(sn || fromVis(existing)));
      }
      if (selectedNodeId === ev.id) showSidebar(ev.id);
    } else if (ev.type === "status") {
      setStatus(ev.message);
    }
  }

  function fromVis(v) {
    return {
      id: v.id, label: v.label,
      word_type: (v.title || "").split(" ")[0],
      root: v.color && v.color.background === "#ffd54f",
      expanded: true
    };
  }

  // ---- SSE stream ----
  var es;
  function connect() {
    es = new EventSource("/events");
    es.onmessage = function (msg) {
      try { applyEvent(JSON.parse(msg.data)); } catch (e) { /* ignore */ }
    };
    es.onerror = function () {
      setStatus("Reconnecting…");
      es.close();
      setTimeout(connect, 1500);
    };
  }
  connect();

  // ---- sidebar ----
  var sidebar = document.getElementById("sidebar");
  var sbTitle = document.getElementById("sb-title");
  var sbBody = document.getElementById("sb-body");
  var selectedNodeId = null;
  var detailsCache = {};

  document.getElementById("sb-close").addEventListener("click", closeSidebar);

  function closeSidebar() {
    sidebar.classList.remove("open");
    selectedNodeId = null;
    network.unselectAll();
  }

  function showSidebar(nodeId) {
    selectedNodeId = nodeId;
    var sn = serverNodes[nodeId];
    sbTitle.innerHTML = (sn ? sn.label : nodeId) +
      (sn ? '<span class="word-type">' + sn.word_type + '</span>' : '');
    sbBody.innerHTML = '<div class="sb-loading">Loading definitions…</div>';
    sidebar.classList.add("open");

    if (detailsCache[nodeId]) {
      renderDetails(detailsCache[nodeId]);
      return;
    }

    fetch("/node-details/" + encodeURIComponent(nodeId))
      .then(function (r) { return r.json(); })
      .then(function (data) {
        detailsCache[nodeId] = data;
        if (selectedNodeId === nodeId) renderDetails(data);
      })
      .catch(function () {
        if (selectedNodeId === nodeId)
          sbBody.innerHTML = '<div class="sb-empty">Could not load details.</div>';
      });
  }

  function renderDetails(data) {
    var html = "";

    if (data.dictionaries && data.dictionaries.length) {
      data.dictionaries.forEach(function (dict) {
        html += '<div class="sb-section"><h3>' + esc(dict.name) + '</h3>';

        if (dict.definitions && dict.definitions.length) {
          html += '<div class="sb-relation-label">Definitions</div>';
          dict.definitions.forEach(function (d, i) {
            if (i < 8) html += '<div class="sb-def">' + esc(d) + '</div>';
          });
          if (dict.definitions.length > 8)
            html += '<div class="sb-def" style="color:var(--muted)">… +' +
              (dict.definitions.length - 8) + ' more</div>';
        }

        if (dict.synonyms && dict.synonyms.length) {
          html += '<div class="sb-relation-label">Synonyms</div><div class="sb-tags">';
          dict.synonyms.slice(0, 20).forEach(function (s) {
            html += '<span class="sb-tag syn">' + esc(s) + '</span>';
          });
          if (dict.synonyms.length > 20) html += '<span class="sb-tag syn">+' + (dict.synonyms.length - 20) + '</span>';
          html += '</div>';
        }

        if (dict.antonyms && dict.antonyms.length) {
          html += '<div class="sb-relation-label">Antonyms</div><div class="sb-tags">';
          dict.antonyms.slice(0, 10).forEach(function (s) {
            html += '<span class="sb-tag ant">' + esc(s) + '</span>';
          });
          html += '</div>';
        }

        if (dict.hypernyms && dict.hypernyms.length) {
          html += '<div class="sb-relation-label">Hypernyms</div><div class="sb-tags">';
          dict.hypernyms.slice(0, 15).forEach(function (s) {
            html += '<span class="sb-tag hyper">' + esc(s) + '</span>';
          });
          if (dict.hypernyms.length > 15) html += '<span class="sb-tag hyper">+' + (dict.hypernyms.length - 15) + '</span>';
          html += '</div>';
        }

        if (dict.hyponyms && dict.hyponyms.length) {
          html += '<div class="sb-relation-label">Hyponyms</div><div class="sb-tags">';
          dict.hyponyms.slice(0, 15).forEach(function (s) {
            html += '<span class="sb-tag hypo">' + esc(s) + '</span>';
          });
          if (dict.hyponyms.length > 15) html += '<span class="sb-tag hypo">+' + (dict.hyponyms.length - 15) + '</span>';
          html += '</div>';
        }

        if (dict.meronyms && dict.meronyms.length) {
          html += '<div class="sb-relation-label">Meronyms</div><div class="sb-tags">';
          dict.meronyms.slice(0, 10).forEach(function (s) {
            html += '<span class="sb-tag mero">' + esc(s) + '</span>';
          });
          html += '</div>';
        }

        html += '</div>';
      });
    } else {
      html += '<div class="sb-empty">No dictionary data available for this concept.</div>';
    }

    // edges
    if ((data.edges_out && data.edges_out.length) || (data.edges_in && data.edges_in.length)) {
      html += '<div class="sb-edges"><h3>Graph connections</h3>';
      if (data.edges_out && data.edges_out.length) {
        data.edges_out.forEach(function (e) {
          var c = REL_COLORS[e.relation] || REL_COLORS.other;
          html += '<div class="sb-edge-item">' +
            '<span class="sb-edge-rel" style="color:' + c + '">' + esc(e.relation) + '</span> → ' +
            esc(e.target) + '</div>';
        });
      }
      if (data.edges_in && data.edges_in.length) {
        data.edges_in.forEach(function (e) {
          var c = REL_COLORS[e.relation] || REL_COLORS.other;
          html += '<div class="sb-edge-item">' +
            esc(e.source) + ' <span class="sb-edge-rel" style="color:' + c + '">' + esc(e.relation) + '</span> →</div>';
        });
      }
      html += '</div>';
    }

    sbBody.innerHTML = html;
  }

  function esc(s) {
    var d = document.createElement("div");
    d.textContent = s;
    return d.innerHTML;
  }

  // ---- interactions ----
  function expandNode(id) {
    var n = nodes.get(id);
    setStatus("Expanding '" + (n ? n.label : id) + "' …");
    fetch("/expand", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id: id })
    });
  }

  network.on("click", function (params) {
    var id = (params.nodes && params.nodes[0]) || network.getNodeAt(params.pointer.DOM);
    if (id) {
      lastClickedNode = id;
      showSidebar(id);
    }
  });

  network.on("doubleClick", function (params) {
    var id = (params.nodes && params.nodes[0])
          || network.getNodeAt(params.pointer.DOM)
          || lastClickedNode;
    if (!id) { setStatus("Double-click directly on a node to expand it."); return; }
    expandNode(id);
  });

  document.getElementById("go").addEventListener("click", decompose);
  document.getElementById("word").addEventListener("keydown", function (e) {
    if (e.key === "Enter") decompose();
  });
  function decompose() {
    var input = document.getElementById("word");
    var word = input.value.trim();
    if (!word) return;
    setStatus("Decomposing '" + word + "' …");
    fetch("/decompose", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ word: word, word_type: "NN" })
    });
    input.value = "";
  }

  document.getElementById("fit").addEventListener("click", function () {
    network.fit({ animation: { duration: 400 } });
  });

  document.getElementById("physics").addEventListener("click", function () {
    userPausedPhysics = !userPausedPhysics;
    setPhysics(!userPausedPhysics);
    this.textContent = userPausedPhysics ? "Resume physics" : "Pause physics";
  });
})();
</script>
</body>
</html>
