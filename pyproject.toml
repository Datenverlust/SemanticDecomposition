[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-decomposition"
version = "0.1.0"
description = "Semantic concept graph construction via dictionary decomposition"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "marker-passing",
]

[project.optional-dependencies]
nlp = ["spacy"]
gpu = ["torch>=2.0"]

[tool.setuptools.packages.find]
include = ["semantic_decomposition*"]

[tool.setuptools.package-data]
"semantic_decomposition.visualization" = ["static/*.html"]

[tool.pytest.ini_options]
pythonpath = ["."]
